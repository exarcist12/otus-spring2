<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Бронирование')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div th:replace="~{layout/base :: alerts}"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-3">Бронирование номера</h3>

                    <div class="alert alert-info">
                        <div><strong th:text="${room.hotelName}"></strong></div>
                        <div>Номер: <span th:text="${room.type}"></span></div>
                        <div>Вместимость: до <span th:text="${room.capacity}"></span> чел.</div>
                        <div>Цена: <strong th:text="${room.pricePerNight}"></span></strong> ₽ / ночь</div>
                    </div>

                    <form th:action="@{/ui/bookings}" method="post" th:object="${bookingForm}">
                        <input type="hidden" th:field="*{roomId}">

                        <div class="mb-3">
                            <label class="form-label">Дата заезда</label>
                            <input type="date" th:field="*{checkIn}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата выезда</label>
                            <input type="date" th:field="*{checkOut}" class="form-control" required>
                        </div>

                        <div class="alert alert-secondary small">
                            Оплата производится автоматически после создания брони.
                            Итоговая сумма рассчитывается как цена × количество ночей.
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-credit-card"></i> Забронировать и оплатить
                            </button>
                            <a th:href="@{/ui/hotels/{id}(id=${room.hotelId})}"
                               class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<script th:replace="~{layout/base :: scripts}"></script>
</body>
</html>
