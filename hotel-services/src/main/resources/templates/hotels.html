<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Отели')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>
<div th:replace="~{layout/base :: alerts}"></div>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Отели</h2>
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/ui/admin/hotels/new}"
           class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Добавить отель
        </a>
    </div>

    <form method="get" th:action="@{/ui/hotels}" class="row g-2 mb-4">
        <div class="col-md-4">
            <select name="cityId" class="form-select">
                <option value="">Все города</option>
                <option th:each="city : ${cities}"
                        th:value="${city.id}"
                        th:text="${city.name}"
                        th:selected="${city.id == selectedCityId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Найти</button>
            <a th:href="@{/ui/hotels}" class="btn btn-outline-secondary">Сбросить</a>
        </div>
    </form>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="hotel : ${hotels}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${hotel.name}"></h5>
                    <p class="card-text text-muted mb-2">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${hotel.cityName}"></span>
                    </p>
                    <div class="text-warning mb-2">
                        <span th:each="i : ${#numbers.sequence(1, hotel.stars)}">★</span>
                        <span th:each="i : ${#numbers.sequence(1, 5 - hotel.stars)}" class="text-muted">★</span>
                    </div>

                    <!-- ↓ НОВОЕ: удобства -->
                    <div class="mb-2" th:if="${not #lists.isEmpty(hotel.amenities)}">
        <span th:each="a : ${hotel.amenities}"
              class="badge bg-light text-dark border me-1 mb-1"
              th:title="${a.name}">
            <i th:class="'bi bi-' + ${a.icon}"></i>
            <span th:text="${a.name}"></span>
        </span>
                    </div>

                    <a th:href="@{/ui/hotels/{id}(id=${hotel.id})}"
                       class="btn btn-outline-primary w-100">
                        Подробнее
                    </a>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(hotels)}" class="text-muted text-center py-4">
        Отелей не найдено.
    </p>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<script th:replace="~{layout/base :: scripts}"></script>
</body>
</html>
