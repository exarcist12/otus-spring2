<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Авторы</title>
    <style>
        body { padding: 50px; }
        table { border-collapse: collapse; width: 500px; }
        th, td { border: 1px solid steelblue; padding: 5px; text-align: left; }
        .btn { padding: 3px 8px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-delete { background: #f44336; color: white; }
        .btn-add { background: #4CAF50; color: white; }
    </style>
</head>
<body>
<h3>Авторы</h3>

<table>
    <thead>
    <tr><th>ID</th><th>Имя</th><th>Действие</th></tr>
    </thead>
    <tbody>
    <tr>
        <form th:action="@{/authors}" th:method="post" th:object="${author}">
            <td></td>
            <td><input type="text" th:field="*{fullName}" placeholder="Имя автора" /></td>
            <td><button type="submit" class="btn btn-add">Добавить</button></td>
        </form>
    </tr>
    <tr th:each="author : ${authors}">
        <td th:text="${author.id}"></td>
        <td th:text="${author.fullName}"></td>
        <td>
            <form th:action="@{/authors/{id}/delete(id=${author.id})}" method="post">
                <button type="submit" class="btn btn-delete">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<br/>
<a href="/">На главную</a>
</body>
</html>
