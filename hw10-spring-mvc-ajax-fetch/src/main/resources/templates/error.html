<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ошибка</title>
    <style>
        body { padding: 50px; font-family: Arial, sans-serif; }
        .error-box { border: 2px solid #f44336; padding: 20px; width: 500px; background: #ffeeee; border-radius: 5px; }
        .error-code { font-size: 48px; color: #f44336; font-weight: bold; }
        .error-message { font-size: 18px; margin: 10px 0; }
        .btn { padding: 8px 20px; background: #2196F3; color: white; border: none; border-radius: 3px; text-decoration: none; }
        .btn:hover { background: #1976D2; }
    </style>
</head>
<body>
<div class="error-box">
    <div class="error-code">404</div>
    <div class="error-message">Страница не найдена</div>
    <p>Запрашиваемая страница не существует.</p>
    <p th:text="${path}"></p>
    <br/>
    <a th:href="@{/}" class="btn">На главную</a>
</div>
</body>
</html>
