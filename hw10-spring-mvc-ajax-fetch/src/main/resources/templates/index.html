<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Библиотека</title>
    <style type="text/css">
        body { padding: 50px; }
        .books { border: 1px solid steelblue; width: 900px; border-collapse: collapse; }
        .books tr td, th { padding: 5px; border: 1px solid steelblue; }
        .books td:first-child { width: 30px; }
        .books td:nth-child(2) { width: 200px; }
        .books td:nth-child(3) { width: 150px; }
        .books td:nth-child(4) { width: 250px; }
        .books td:last-child { width: 200px; text-align: center; white-space: nowrap; }
        .books td:last-child form { display: inline-block; margin: 0; padding: 0; }
        .books td:last-child a { display: inline-block; margin-right: 5px; padding: 3px 8px; text-decoration: none; background-color: #aaa; color: white; border-radius: 3px; font-size: 12px; }
        .books td:last-child .btn { padding: 3px 8px; font-size: 12px; margin: 0 2px; }
        select, input[type="text"] { width: 100%; box-sizing: border-box; }
        .btn { padding: 3px 10px; cursor: pointer; border: none; border-radius: 3px; }
        .btn-add { background-color: #4CAF50; color: white; }
        .btn-save { background-color: #2196F3; color: white; }
        .btn-delete { background-color: #f44336; color: white; }
        form { display: inline-block; margin: 0; padding: 0; }
    </style>
</head>
<body>

<h3>Библиотека</h3>

<table class="books" id="booksTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Автор</th>
        <th>Жанры</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody id="booksBody">
    <!-- Строка добавления будет вставлена через JS -->
    </tbody>
</table>

<br/>
<p>
    <a href="/authors">Авторы</a> |
    <a href="/genres">Жанры</a>
</p>

<script>
    let authors = [];
    let genres = [];

    function createAddRow() {
        const row = document.createElement('tr');
        row.id = 'add-row';
        row.innerHTML = `
            <td></td>
            <td><input type="text" id="newTitle" placeholder="Название" /></td>
            <td>
                <select id="newAuthorId"></select>
            </td>
            <td>
                <select id="newGenreIds" multiple></select>
            </td>
            <td>
                <button class="btn btn-add" onclick="createBook()">Добавить</button>
            </td>
        `;
        return row;
    }

    function loadSelects() {
        console.log('Loading selects...');
        Promise.all([
            fetch('/api/authors').then(r => r.json()),
            fetch('/api/genres').then(r => r.json())
        ]).then(([authorsData, genresData]) => {
            authors = authorsData;
            genres = genresData;
            console.log('Authors loaded:', authors);
            console.log('Genres loaded:', genres);
            loadBooks();
        }).catch(err => console.error('Error loading selects:', err));
    }

    function loadBooks() {
        console.log('Loading books...');
        fetch('/api/books')
            .then(response => {
                if (!response.ok) throw new Error('HTTP error ' + response.status);
                return response.json();
            })
            .then(books => {
                console.log('Books loaded:', books);
                const tbody = document.getElementById('booksBody');
                tbody.innerHTML = '';
                // Добавляем строку добавления
                const addRow = createAddRow();
                tbody.appendChild(addRow);

                // Заполняем селекты в строке добавления
                const authorSelect = document.getElementById('newAuthorId');
                if (authorSelect) {
                    authorSelect.innerHTML = '';
                    authors.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.fullName;
                        authorSelect.appendChild(opt);
                    });
                }
                const genreSelect = document.getElementById('newGenreIds');
                if (genreSelect) {
                    genreSelect.innerHTML = '';
                    genres.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g.id;
                        opt.textContent = g.name;
                        genreSelect.appendChild(opt);
                    });
                }

                // Добавляем строки книг
                books.forEach(book => {
                    const row = document.createElement('tr');
                    row.id = `book-row-${book.id}`;
                    row.innerHTML = `
                        <td>${book.id}</td>
                        <td><input type="text" id="title-${book.id}" value="${book.title}" /></td>
                        <td>
                            <select id="author-${book.id}">
                                ${authors.map(a => `<option value="${a.id}" ${a.id === book.authorId ? 'selected' : ''}>${a.fullName}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <select id="genres-${book.id}" multiple>
                                ${genres.map(g => `<option value="${g.id}" ${book.genres.some(bg => bg.id === g.id) ? 'selected' : ''}>${g.name}</option>`).join('')}
                            </select>
                        </td>
                        <td>
                            <a href="/books/${book.id}" class="btn-view">Просмотр</a>
                            <button class="btn btn-save" onclick="updateBook(${book.id})">Сохранить</button>
                            <button class="btn btn-delete" onclick="deleteBook(${book.id})">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => console.error('Error loading books:', err));
    }

    function createBook() {
        const title = document.getElementById('newTitle').value;
        const authorId = parseInt(document.getElementById('newAuthorId').value);
        const genreSelect = document.getElementById('newGenreIds');
        const genreIds = Array.from(genreSelect.selectedOptions).map(opt => parseInt(opt.value));

        const payload = { title, authorId, genreIds };
        console.log('Creating book:', payload);

        fetch('/api/books', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(response => {
            if (!response.ok) throw new Error('HTTP error ' + response.status);
            return response.json();
        }).then(() => {
            document.getElementById('newTitle').value = '';
            loadBooks();
        }).catch(err => console.error('Error creating book:', err));
    }

    function updateBook(id) {
        const title = document.getElementById(`title-${id}`).value;
        const authorId = parseInt(document.getElementById(`author-${id}`).value);
        const genreSelect = document.getElementById(`genres-${id}`);
        const genreIds = Array.from(genreSelect.selectedOptions).map(opt => parseInt(opt.value));

        const payload = { title, authorId, genreIds };
        console.log('Updating book:', id, payload);

        fetch(`/api/books/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(response => {
            if (!response.ok) throw new Error('HTTP error ' + response.status);
            return response.json();
        }).then(() => {
            loadBooks();
        }).catch(err => console.error('Error updating book:', err));
    }

    function deleteBook(id) {
        if (!confirm('Удалить книгу?')) return;
        console.log('Deleting book:', id);
        fetch(`/api/books/${id}`, { method: 'DELETE' })
            .then(response => {
                if (!response.ok) throw new Error('HTTP error ' + response.status);
                loadBooks();
            })
            .catch(err => console.error('Error deleting book:', err));
    }

    loadSelects();
</script>

</body>
</html>
