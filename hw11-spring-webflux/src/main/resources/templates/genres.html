<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Жанры</title>
    <style>
        body { padding: 50px; }
        table { border-collapse: collapse; width: 500px; }
        th, td { border: 1px solid steelblue; padding: 5px; text-align: left; }
        .btn { padding: 3px 8px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-add { background: #4CAF50; color: white; }
        .btn-delete { background: #f44336; color: white; }
    </style>
</head>
<body>
<h3>Жанры</h3>

<table>
    <thead>
    <tr><th>ID</th><th>Название</th><th>Действие</th></tr>
    </thead>
    <tbody id="genresBody">
    </tbody>
</table>

<br/>
<a href="/books">На главную</a>

<script>
    function createAddRow() {
        const row = document.createElement('tr');
        row.id = 'add-genre-row';
        row.innerHTML = `
            <td></td>
            <td><input type="text" id="newGenreName" placeholder="Название жанра" /></td>
            <td><button class="btn btn-add" onclick="createGenre()">Добавить</button></td>
        `;
        return row;
    }

    function loadGenres() {
        fetch('/api/genres')
            .then(response => response.json())
            .then(genres => {
                const tbody = document.getElementById('genresBody');
                tbody.innerHTML = '';
                tbody.appendChild(createAddRow());
                genres.forEach(genre => {
                    const row = document.createElement('tr');
                    row.id = `genre-row-${genre.id}`;
                    row.innerHTML = `
                        <td>${genre.id}</td>
                        <td>${genre.name}</td>
                        <td>
                            <button class="btn btn-delete" onclick="deleteGenre(${genre.id})">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            });
    }

    function createGenre() {
        const name = document.getElementById('newGenreName').value;
        if (!name.trim()) return alert('Введите название');
        fetch('/api/genres', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(() => {
            document.getElementById('newGenreName').value = '';
            loadGenres();
        });
    }

    function deleteGenre(id) {
        if (!confirm('Удалить жанр?')) return;
        fetch(`/api/genres/${id}`, { method: 'DELETE' })
            .then(() => loadGenres());
    }

    loadGenres();
</script>
</body>
</html>
